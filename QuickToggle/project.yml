name: QuickToggle
options:
  bundleIdPrefix: com.quicktoggle
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic

targets:
  QuickToggle:
    type: application
    platform: iOS
    sources:
      - QuickToggle
    settings:
      base:
        INFOPLIST_FILE: QuickToggle/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.quicktoggle.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
    entitlements:
      path: QuickToggle/QuickToggle.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.quicktoggle.shared
    dependencies:
      - target: QuickToggleWidgetExtension
    preBuildScripts: []

  QuickToggleWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - QuickToggleWidget
    settings:
      base:
        INFOPLIST_FILE: QuickToggleWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.quicktoggle.app.widget
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        SKIP_INSTALL: true
    entitlements:
      path: QuickToggleWidget/QuickToggleWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.quicktoggle.shared
